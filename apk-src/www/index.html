<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kedai Kopi Senja</title>
<style>
:root{--bata:#b5452f;--hijau:#1f4d45;--krem:#f7f2e6;--kartu:#fffdf7;--border:#cdbf9f;--sekunder:#6f6a5c;--teks:#2b2a26}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--krem);color:var(--teks);padding-bottom:70px}
header{background:var(--hijau);color:#fff;padding:16px;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:700}
main{padding:16px}
h2{font-family:Fraunces,Georgia,serif;margin:4px 0 12px;font-size:20px}
.kartu{background:var(--kartu);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:16px;margin:6px 0 12px;background:#fff}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--bata);color:#fff;font-weight:700;font-size:16px;margin-top:4px}
button.sekunder{background:var(--hijau)}
button.kecil{width:auto;padding:6px 12px;font-size:14px;margin:0}
.pesan{padding:10px;border-radius:12px;margin-bottom:12px;display:none}
.pesan.galat{background:#f8d7d1;color:#8E2A20;display:block}
.pesan.info{background:#fdeec6;color:#8A6100;display:block}
.baris{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.habis{color:#8E2A20;font-weight:700}
.sekunder-teks{color:var(--sekunder);font-size:14px}
.tautan{color:var(--bata);text-align:center;cursor:pointer;margin-top:12px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:none;background:var(--kartu);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--sekunder);font-size:13px;padding:10px 0;border-radius:0;font-weight:600;margin:0}
nav button.aktif{color:var(--bata)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-tab="menu">Menu</button>
  <button data-tab="keranjang">Keranjang</button>
  <button data-tab="pesanan">Pesanan</button>
  <button data-tab="akun">Akun</button>
</nav>

<script>
const KUNCI = { server: 'kks_server', token: 'kks_token', nomor: 'kks_nomor', wajib: 'kks_wajib' };
const SERVER_BAWAAN = 'http://10.10.1.225:8000';

let mode = 'login';        // 'login' atau 'daftar'
let tab = 'menu';          // menu | keranjang | pesanan | akun
let lihatId = null;        // id pesanan yang sedang dibuka strukynya
let menuCache = [];
let keranjang = {};        // { menuId: { nama, harga, qty } }

function server() {
  return (localStorage.getItem(KUNCI.server) || SERVER_BAWAAN).replace(/\/$/, '');
}
function token() { return localStorage.getItem(KUNCI.token); }
function sudahWajibGanti() { return localStorage.getItem(KUNCI.wajib) === '1'; }
function rp(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Satu pintu untuk semua panggilan API. Menangani 401, 403 wajib ganti, dan galat jaringan.
async function api(metode, path, body) {
  const headers = { Accept: 'application/json' };
  if (body) headers['Content-Type'] = 'application/json';
  if (token()) headers['Authorization'] = 'Bearer ' + token();

  let res;
  try {
    res = await fetch(server() + '/api/' + path, {
      method: metode,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    throw { pesan: 'Server tidak bisa dihubungi. Periksa alamat server di menu Akun dan pastikan HP satu jaringan dengan laptop.' };
  }

  let data = null;
  try { data = await res.json(); } catch (e) {}

  if (res.status === 401) {
    keluar();
    throw { pesan: 'Sesi habis, silakan masuk lagi.' };
  }
  if (res.status === 403 && data && data.wajib_ganti_password) {
    localStorage.setItem(KUNCI.wajib, '1');
    render();
    throw { pesan: data.pesan };
  }
  if (!res.ok) {
    let pesan = 'Terjadi kesalahan.';
    if (res.status === 404) pesan = 'Pesanan tidak ditemukan.';
    else if (data && data.errors) pesan = Object.values(data.errors)[0][0];
    else if (data && data.message) pesan = data.message;
    throw { pesan, stok: data && data.errors ? data.errors.stok : null };
  }
  return data;
}

function tampilPesan(id, html, galat) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'pesan ' + (galat ? 'galat' : 'info');
  el.innerHTML = html;
}

function keluar() {
  localStorage.removeItem(KUNCI.token);
  localStorage.removeItem(KUNCI.nomor);
  localStorage.removeItem(KUNCI.wajib);
  keranjang = {};
  lihatId = null;
  tab = 'menu';
  mode = 'login';
}

function render() {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const masuk = !!token();

  if (!masuk) {
    nav.style.display = 'none';
    return layarMasuk(app);
  }
  if (sudahWajibGanti()) {
    nav.style.display = 'none';
    return layarGantiPassword(app, true);
  }

  nav.style.display = 'flex';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('aktif', b.dataset.tab === tab));
  ({ menu: layarMenu, keranjang: layarKeranjang, pesanan: layarPesanan, akun: layarAkun })[tab](app);
}

// ---------- Masuk dan daftar ----------
function layarMasuk(app) {
  const judul = mode === 'login' ? 'Masuk' : 'Daftar akun';
  app.innerHTML = `
    <header>Kedai Kopi Senja</header>
    <main>
      <div class="kartu">
        <h2>${judul}</h2>
        <div id="pesan" class="pesan"></div>
        <label>Nomor HP</label>
        <input id="nomor" inputmode="numeric" placeholder="08xxxxxxxxxx">
        <label>Password</label>
        <input id="pw" type="password" placeholder="Minimal 8 karakter">
        <button id="kirim">${mode === 'login' ? 'Masuk' : 'Daftar'}</button>
        <div class="tautan" id="ganti">${mode === 'login' ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk'}</div>
      </div>
    </main>`;

  document.getElementById('ganti').onclick = () => { mode = mode === 'login' ? 'daftar' : 'login'; render(); };
  document.getElementById('kirim').onclick = async () => {
    const nomor = document.getElementById('nomor').value.trim();
    const pw = document.getElementById('pw').value;
    try {
      const d = await api('POST', mode === 'login' ? 'login' : 'daftar', { nomor_hp: nomor, password: pw });
      localStorage.setItem(KUNCI.token, d.token);
      localStorage.setItem(KUNCI.nomor, nomor);
      localStorage.setItem(KUNCI.wajib, d.wajib_ganti_password ? '1' : '0');
      tab = 'menu';
      render();
    } catch (e) {
      tampilPesan('pesan', esc(e.pesan), true);
    }
  };
}

// ---------- Ganti password (dipakai juga untuk wajib ganti) ----------
function formGantiPassword() {
  return `
    <div id="pesan" class="pesan"></div>
    <label>Password lama</label>
    <input id="pw-lama" type="password">
    <label>Password baru</label>
    <input id="pw-baru" type="password" placeholder="Minimal 8 karakter">
    <label>Ulangi password baru</label>
    <input id="pw-ulang" type="password">
    <button id="simpan-pw">Simpan password</button>`;
}

function pasangGantiPassword(saatBerhasil) {
  document.getElementById('simpan-pw').onclick = async () => {
    try {
      await api('POST', 'ganti-password', {
        password_lama: document.getElementById('pw-lama').value,
        password_baru: document.getElementById('pw-baru').value,
        password_baru_confirmation: document.getElementById('pw-ulang').value
      });
      localStorage.setItem(KUNCI.wajib, '0');
      tampilPesan('pesan', 'Password berhasil diganti.', false);
      setTimeout(saatBerhasil, 800);
    } catch (e) {
      tampilPesan('pesan', esc(e.pesan), true);
    }
  };
}

function layarGantiPassword(app, wajib) {
  app.innerHTML = `
    <header>${wajib ? 'Ganti password' : 'Ganti password'}</header>
    <main>
      <div class="kartu">
        ${wajib ? '<h2>Password sementara Anda harus diganti</h2><p class="sekunder-teks">Ganti sekarang untuk melanjutkan.</p>' : ''}
        ${formGantiPassword()}
      </div>
    </main>`;
  pasangGantiPassword(() => { tab = 'akun'; render(); });
}

// ---------- Menu ----------
async function layarMenu(app) {
  app.innerHTML = `<header>Menu</header><main><div id="pesan" class="pesan"></div><div id="daftar">Memuat...</div></main>`;
  try {
    menuCache = await api('GET', 'menu');
    const daftar = document.getElementById('daftar');
    daftar.innerHTML = menuCache.map(m => `
      <div class="kartu">
        <div class="baris">
          <div>
            <b>${esc(m.nama)}</b>
            <div class="sekunder-teks">${esc(m.kategori)} · sisa ${m.sisa_porsi} porsi</div>
          </div>
          <div style="text-align:right">
            <div><b>${rp(m.harga)}</b></div>
            ${m.habis
              ? '<div class="habis">Habis</div>'
              : `<button class="kecil" data-tambah="${m.id}">+ Tambah</button>`}
          </div>
        </div>
      </div>`).join('') || '<div class="kartu">Belum ada menu.</div>';

    daftar.querySelectorAll('[data-tambah]').forEach(b => {
      b.onclick = () => {
        const m = menuCache.find(x => x.id === +b.dataset.tambah);
        if (!keranjang[m.id]) keranjang[m.id] = { nama: m.nama, harga: m.harga, qty: 0 };
        keranjang[m.id].qty++;
        tampilPesan('pesan', esc(m.nama) + ' ditambahkan ke keranjang.', false);
      };
    });
  } catch (e) {
    tampilPesan('pesan', esc(e.pesan), true);
  }
}

// ---------- Keranjang ----------
function layarKeranjang(app) {
  const daftar = Object.entries(keranjang).filter(([, i]) => i.qty > 0);
  if (!daftar.length) {
    app.innerHTML = `<header>Keranjang</header><main><div class="kartu">Keranjang masih kosong.</div></main>`;
    return;
  }
  const subtotal = daftar.reduce((s, [, i]) => s + i.harga * i.qty, 0);

  app.innerHTML = `
    <header>Keranjang</header>
    <main>
      <div id="pesan" class="pesan"></div>
      ${daftar.map(([id, i]) => `
        <div class="kartu">
          <div class="baris">
            <div><b>${esc(i.nama)}</b><div class="sekunder-teks">${rp(i.harga)}</div></div>
            <div>
              <button class="kecil sekunder" data-kurang="${id}">−</button>
              <b style="margin:0 8px">${i.qty}</b>
              <button class="kecil" data-tambah="${id}">+</button>
            </div>
          </div>
        </div>`).join('')}
      <div class="kartu">
        <label>Nomor meja</label>
        <select id="meja">${Array.from({ length: 10 }, (_, k) => `<option value="${k + 1}">Meja ${k + 1}</option>`).join('')}</select>
        <label>Metode bayar</label>
        <select id="bayar"><option>Tunai</option><option>QRIS</option></select>
        <div class="baris"><b>Subtotal</b><b>${rp(subtotal)}</b></div>
        <p class="sekunder-teks">Service 5% dan pajak 10% dihitung server saat pesanan dibuat.</p>
        <button id="kirim-pesanan">Pesan sekarang</button>
      </div>
    </main>`;

  app.querySelectorAll('[data-tambah]').forEach(b => b.onclick = () => { keranjang[b.dataset.tambah].qty++; render(); });
  app.querySelectorAll('[data-kurang]').forEach(b => b.onclick = () => { keranjang[b.dataset.kurang].qty--; render(); });

  document.getElementById('kirim-pesanan').onclick = async () => {
    const body = {
      nomor_meja: +document.getElementById('meja').value,
      metode_bayar: document.getElementById('bayar').value,
      items: daftar.map(([id, i]) => ({ menu_id: +id, qty: i.qty }))
    };
    try {
      const p = await api('POST', 'pesanan', body);
      keranjang = {};
      lihatId = p.id;
      tab = 'pesanan';
      render();
    } catch (e) {
      // Stok kurang: kalimat umum dari desain, plus rincian bahan dari server.
      let html = esc(e.pesan);
      if (e.stok) {
        html = 'Stok tidak cukup untuk jumlah ini. Kurangi jumlah pesanan.<ul>' +
          e.stok.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
      }
      tampilPesan('pesan', html, true);
    }
  };
}

// ---------- Pesanan dan struk ----------
async function layarPesanan(app) {
  if (lihatId) return layarStruk(app, lihatId);

  app.innerHTML = `<header>Pesanan saya</header><main><div id="pesan" class="pesan"></div><div id="daftar">Memuat...</div></main>`;
  try {
    const list = await api('GET', 'pesanan');
    const daftar = document.getElementById('daftar');
    daftar.innerHTML = list.map(p => `
      <div class="kartu" data-buka="${p.id}" style="cursor:pointer">
        <div class="baris"><b>${esc(p.nomor)}</b><span>${esc(p.status)}</span></div>
        <div class="sekunder-teks">Meja ${p.nomor_meja} · ${rp(p.total)}</div>
      </div>`).join('') || '<div class="kartu">Belum ada pesanan.</div>';
    daftar.querySelectorAll('[data-buka]').forEach(el => el.onclick = () => { lihatId = +el.dataset.buka; render(); });
  } catch (e) {
    tampilPesan('pesan', esc(e.pesan), true);
  }
}

async function layarStruk(app, id) {
  app.innerHTML = `<header>Struk</header><main><button class="sekunder" id="kembali">← Kembali</button><div id="pesan" class="pesan"></div><div id="struk"></div></main>`;
  document.getElementById('kembali').onclick = () => { lihatId = null; render(); };
  try {
    const p = await api('GET', 'pesanan/' + id);
    document.getElementById('struk').innerHTML = `
      <div class="kartu">
        <h2>${esc(p.nomor)}</h2>
        <div class="sekunder-teks">Status: <b>${esc(p.status)}</b> · Meja ${p.nomor_meja} · ${esc(p.metode_bayar)}</div>
        <div class="sekunder-teks">${new Date(p.dibuat).toLocaleString('id-ID')}</div>
        <hr>
        ${p.items.map(i => `<div class="baris"><span>${i.qty}x ${esc(i.menu)}</span><span>${rp(i.subtotal)}</span></div>`).join('')}
        <hr>
        <div class="baris"><span>Subtotal</span><span>${rp(p.subtotal)}</span></div>
        <div class="baris"><span>Service 5%</span><span>${rp(p.service)}</span></div>
        <div class="baris"><span>Pajak 10%</span><span>${rp(p.pajak)}</span></div>
        <div class="baris"><b>Total</b><b>${rp(p.total)}</b></div>
      </div>`;
  } catch (e) {
    tampilPesan('pesan', esc(e.pesan), true);
  }
}

// ---------- Akun ----------
function layarAkun(app) {
  app.innerHTML = `
    <header>Akun</header>
    <main>
      <div class="kartu">
        <b>${esc(localStorage.getItem(KUNCI.nomor))}</b>
        <div class="sekunder-teks">Pelanggan</div>
      </div>
      <div class="kartu">
        <h2>Ganti password</h2>
        ${formGantiPassword()}
      </div>
      <div class="kartu">
        <h2>Alamat server</h2>
        <input id="alamat" value="${esc(server())}">
        <button class="sekunder" id="simpan-alamat">Simpan alamat</button>
        <p class="sekunder-teks">Isi alamat laptop, misalnya ${SERVER_BAWAAN}</p>
        <div id="pesan-alamat"></div>
      </div>
      <button id="keluar" class="sekunder">Keluar</button>
    </main>`;

  pasangGantiPassword(() => { document.getElementById('pw-lama').value = ''; });

  document.getElementById('simpan-alamat').onclick = () => {
    const v = document.getElementById('alamat').value.trim();
    if (!/^https?:\/\//.test(v)) {
      document.getElementById('pesan-alamat').innerHTML = '<div class="pesan galat">Alamat harus diawali http:// atau https://</div>';
      return;
    }
    localStorage.setItem(KUNCI.server, v);
    document.getElementById('pesan-alamat').innerHTML = '<div class="pesan info">Alamat disimpan.</div>';
  };

  document.getElementById('keluar').onclick = async () => {
    try { await api('POST', 'logout'); } catch (e) {}
    keluar();
    render();
  };
}

// ---------- Navigasi ----------
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => { tab = b.dataset.tab; lihatId = null; render(); };
});
render();
</script>
</body>
</html>
